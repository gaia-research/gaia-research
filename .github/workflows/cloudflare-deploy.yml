name: cloudflare-deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'data/**'
      - 'lib/**'
      - 'scripts/**'
      - 'next.config.mjs'
      - 'open-next.config.ts'
      - 'wrangler.jsonc'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      dry_run:
        description: 'Dry run (build bundle and verify wrangler without publishing)'
        required: false
        default: false
        type: boolean

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Cloudflare bundle
        run: |
          echo "Building OpenNext Cloudflare Worker bundle..."
          npm run build
          test -f .open-next/worker.js || { echo "Worker bundle .open-next/worker.js not found!" >&2; exit 1; }
          echo "Bundle built successfully."

      - name: Check Cloudflare deployment credentials (fail-closed)
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IS_DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials verified in GitHub Actions secrets."
          else
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            if [ "$IS_DRY_RUN" = "true" ]; then
              echo "Notice: Cloudflare credentials not set, but dry_run is active. Continuing validation only."
            else
              echo "::error::Missing required production deployment secrets: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID must be configured in repository secrets." >&2
              echo "Failing closed to prevent unauthenticated, partial, or silent deployment bypass in production." >&2
              exit 1
            fi
          fi

      - name: Check for duplicate Cloudflare Git integration deployments
        id: duplicate_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking whether Cloudflare Git integration has already built and deployed commit ${{ github.sha }}..."
          skip_deploy=false

          # Query check-runs for this commit to detect external Cloudflare GitHub App deployment
          cf_runs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" --jq '.check_runs[] | select(.name == "Workers Builds: gaia-research" or .app.slug == "cloudflare-workers-and-pages")' 2>/dev/null || true)

          if [ -n "$cf_runs" ]; then
            cf_conclusion=$(echo "$cf_runs" | jq -r '.conclusion // empty' | head -n 1)
            cf_status=$(echo "$cf_runs" | jq -r '.status // empty' | head -n 1)
            echo "Cloudflare Git integration check-run detected: status=$cf_status, conclusion=$cf_conclusion"

            if [ "$cf_conclusion" = "success" ]; then
              echo "Cloudflare Git integration has already successfully deployed commit ${{ github.sha }}."
              echo "Skipping redundant Wrangler deployment to prevent duplicate deployment race condition."
              skip_deploy=true
            elif [ "$cf_status" = "in_progress" ]; then
              echo "Cloudflare Git integration is currently building commit ${{ github.sha }}."
              echo "Waiting up to 60s for Cloudflare Git integration to settle before deciding..."
              for i in {1..12}; do
                sleep 5
                current_conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" --jq '.check_runs[] | select(.name == "Workers Builds: gaia-research") | .conclusion' 2>/dev/null || true)
                if [ "$current_conclusion" = "success" ]; then
                  echo "Cloudflare Git integration finished with success. Skipping duplicate deploy."
                  skip_deploy=true
                  break
                elif [ -n "$current_conclusion" ] && [ "$current_conclusion" != "null" ]; then
                  echo "Cloudflare Git integration settled with conclusion: $current_conclusion. Proceeding with authoritative Wrangler deploy."
                  break
                fi
              done
            fi
          else
            echo "No Cloudflare Git integration check-run detected. Proceeding with authoritative Wrangler deploy."
          fi

          echo "skip_deploy=$skip_deploy" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: steps.credentials.outputs.has_credentials == 'true' && steps.duplicate_check.outputs.skip_deploy != 'true' && inputs.dry_run != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying to Cloudflare Workers..."
          max_attempts=3
          attempt=1
          success=false

          while [ $attempt -le $max_attempts ]; do
            echo "Deployment attempt $attempt of $max_attempts..."
            if npx wrangler deploy; then
              success=true
              echo "Deployment succeeded on attempt $attempt."
              break
            else
              echo "Deployment attempt $attempt failed with exit code $?." >&2
              if [ $attempt -lt $max_attempts ]; then
                wait_time=$((attempt * 10))
                echo "Backing off for ${wait_time}s before retrying..."
                sleep $wait_time
              fi
            fi
            attempt=$((attempt + 1))
          done

          if [ "$success" = false ]; then
            echo "Cloudflare deployment failed after $max_attempts attempts." >&2
            exit 1
          fi

      - name: Bounded live-site release smoke check
        id: smoke
        if: steps.deploy.outcome == 'success' || steps.duplicate_check.outputs.skip_deploy == 'true'
        run: |
          echo "Starting bounded live-site release smoke verification..."
          endpoints=(
            "https://research.gaiaskilltree.com/"
            "https://research.gaiaskilltree.com/robots.txt"
            "https://research.gaiaskilltree.com/blog"
            "https://research.gaiaskilltree.com/research/orchestration-guide"
          )

          max_attempts=6
          for url in "${endpoints[@]}"; do
            echo "Verifying endpoint: $url"
            attempt=1
            endpoint_ok=false

            while [ $attempt -le $max_attempts ]; do
              echo "  Attempt $attempt/$max_attempts for $url..."
              http_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "$url" || echo "000")

              if [ "$http_code" = "200" ]; then
                echo "  ✓ $url returned HTTP 200 OK"
                endpoint_ok=true
                break
              else
                echo "  ⚠ $url returned HTTP $http_code (attempt $attempt/$max_attempts)" >&2
                if [ $attempt -lt $max_attempts ]; then
                  sleep 5
                fi
              fi
              attempt=$((attempt + 1))
            done

            if [ "$endpoint_ok" = false ]; then
              echo "::error::Release smoke verification failed for $url: did not return HTTP 200 after $max_attempts attempts." >&2
              exit 1
            fi
          done

          echo "✓ All live-site endpoints verified HTTP 200 OK."

      - name: Record deployment step summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Cloudflare Deployment Report

          | Metric | Value |
          |---|---|
          | **Trigger Event** | `${{ github.event_name }}` |
          | **Ref / Commit** | `${{ github.ref }} (${{ github.sha }})` |
          | **Actor** | `${{ github.actor }}` |
          | **Target Environment** | `${{ inputs.environment || 'production' }}` |
          | **Dry Run** | `${{ inputs.dry_run || 'false' }}` |
          | **Credentials Configured** | `${{ steps.credentials.outputs.has_credentials || 'false' }}` |
          | **Duplicate Deploy Skipped** | `${{ steps.duplicate_check.outputs.skip_deploy || 'false' }}` |
          | **Deploy Step Outcome** | `${{ steps.deploy.outcome || 'skipped/not run' }}` |
          | **Smoke Check Outcome** | `${{ steps.smoke.outcome || 'skipped/not run' }}` |

          EOF

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          > 🔍 **Status: DRY RUN (Validation Only)**
          > OpenNext worker bundle was verified and compiled successfully.
          > Production deployment was skipped by operator flag. No changes were published.
          EOF
          elif [ "${{ steps.credentials.outputs.has_credentials }}" = "false" ]; then
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          > ❌ **Status: FAILED CLOSED**
          > `CLOUDFLARE_API_TOKEN` and/or `CLOUDFLARE_ACCOUNT_ID` are missing from repository secrets.
          > Production deployment failed closed. Configure these secrets in repository settings to enable automated deployment.
          EOF
          elif [ "${{ steps.deploy.outcome }}" = "success" ] && [ "${{ steps.smoke.outcome }}" = "success" ]; then
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          > ✅ **Status: DEPLOYED & VERIFIED**
          > Production release succeeded via authoritative Wrangler deployment.
          > Live-site smoke verification confirmed HTTP 200 across key routes.
          > URL: `https://research.gaiaskilltree.com`
          EOF
          elif [ "${{ steps.duplicate_check.outputs.skip_deploy }}" = "true" ] && [ "${{ steps.smoke.outcome }}" = "success" ]; then
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          > ℹ️ **Status: DEDUPLICATED & VERIFIED**
          > Cloudflare Git Integration already deployed commit `${{ github.sha }}`.
          > Redundant Wrangler deploy was skipped to avoid duplicate deployment race condition.
          > Live-site smoke verification confirmed HTTP 200 across key routes.
          EOF
          elif [ "${{ steps.deploy.outcome }}" = "failure" ] || [ "${{ steps.smoke.outcome }}" = "failure" ]; then
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          > ❌ **Status: FAILED**
          > Production deployment or live-site release smoke check failed. Inspect workflow job logs for details.
          EOF
          else
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          > ⚠️ **Status: NOT DEPLOYED**
          > Deployment was not completed. Skipped deployments cannot report success.
          EOF
          fi
